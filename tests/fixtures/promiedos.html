<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integración Promiedos</title>
<style>
  body { margin: 16px; background: #12452e; color: white; font: 14px sans-serif; }
  .flex-12 { display: flex; flex-direction: column; gap: 12px; }
  [class*="match-info_itemevent__"] { background: #0a2b1d; border-radius: 8px; }
  [class*="event-header_button__"] { display: flex; align-items: center; padding: 4px 12px; }
  [class*="event-header_left__"] { flex: 1; }
  [class*="event-header_right__"] { display: flex; gap: 8px; }
  button { width: 24px; height: 24px; }
  button svg { width: 18px; height: 18px; }
  .item-event__content { min-height: 80px; }
  .header__container { display: flex; align-items: center; justify-content: space-between; }
  .header__buttons { display: none; }
  @media (max-width: 767.98px) {
    .header { position: relative; z-index: 100; }
    .header__buttons { display: flex; }
    [class*="aside_mainBlockAside__"] { position: fixed; top: 0; width: 100%; height: 100vh; z-index: 70; background: #12452e; padding-top: 64px; }
  }
</style>
<header class="header">
  <div class="header__container">
    <a class="header__logo" href="/">Promiedos</a>
    <div class="header__buttons">
      <button class="header__button-menu icon-menu" aria-label="Menú" aria-expanded="false">☰</button>
    </div>
  </div>
</header>
<aside class="aside_mainBlockAside__hashnuevo" style="right: -120%">
  <a href="/league/test/bac">Libertadores</a>
</aside>
<div class="main-header-block_botton-header__buttons__hashnuevo">
  <button class="main-header-block_greencuotas__hashnuevo">CUOTAS</button>
  <div class="styles_badge__hashnuevo">Aviso cuotas</div>
</div>
<div class="styles_badge__ajeno" id="insignia-ajena">Otro aviso</div>
<div class="promotions"><div class="reclama-block-1">Promoción</div></div>
<main><div class="flex-12" id="competiciones"></div></main>
<script>
  const botonMenu = document.querySelector('.header__button-menu');
  botonMenu.onclick = () => {
    const expandido = botonMenu.getAttribute('aria-expanded') !== 'true';
    botonMenu.setAttribute('aria-expanded', String(expandido));
    document.querySelector('aside').style.right = expandido ? '0' : '-120%';
  };
  const estado = new Map();
  window.clicsNativos = { colapsar: 0, sonido: 0 };
  window.maqueta = {
    renderizar(competiciones = [
      { id: 'bac', nombre: 'Libertadores' },
      { id: 'dij', nombre: 'Sudamericana' },
      { id: 'bae', nombre: 'Liga', sinEnlace: true },
      { id: 'zzz', nombre: 'Liga' },
    ]) {
      document.getElementById('competiciones').replaceChildren();
      for (const competicion of competiciones) {
        const tarjeta = document.createElement('div');
        tarjeta.className = 'ajena match-info_itemevent__hashnuevo';
        tarjeta.dataset.idMaqueta = competicion.id;
        const modelo = { ...competicion, tarjeta, expandida: true, sonido: true };
        estado.set(competicion.id, modelo);
        document.getElementById('competiciones').append(tarjeta);
        this.pintar(modelo);
      }
    },
    pintar(modelo) {
      const { tarjeta, id, nombre, sinEnlace, expandida, sonido, sinCampana } = modelo;
      tarjeta.innerHTML = `
        <div class="event-header_button__hashnuevo">
          <${sinEnlace ? 'div' : 'a'} class="event-header_left__hashnuevo" ${sinEnlace ? '' : `href="/league/test/${id}"`}>
            <img src="https://api.promiedos.com.ar/images/league/${id}/1" alt="">${nombre}
          </${sinEnlace ? 'div' : 'a'}>
          <div class="event-header_right__hashnuevo">
            ${sinCampana ? '' : `<button data-nativo="sonido"><svg class="lucide lucide-${sonido ? 'bell' : 'bell-off'}"></svg></button>`}
            <button data-nativo="colapsar"><svg class="lucide lucide-chevron-down" style="transform:${expandida ? 'rotate(180deg)' : ''}"></svg></button>
          </div>
        </div>
        ${expandida ? '<div class="item-event__content"><span class="score">0 - 0</span><div class="match-block__cof">1.5</div></div>' : ''}`;
      tarjeta.querySelector('[data-nativo="colapsar"]').onclick = () => {
        window.clicsNativos.colapsar++;
        modelo.expandida = !modelo.expandida;
        // Reconstruye el encabezado, como puede hacer React al navegar o reconciliar.
        this.pintar(modelo);
      };
      const campana = tarjeta.querySelector('[data-nativo="sonido"]');
      if (campana) campana.onclick = () => {
        window.clicsNativos.sonido++;
        modelo.sonido = !modelo.sonido;
        this.pintar(modelo);
      };
    },
    quitarCampanas() {
      for (const modelo of estado.values()) { modelo.sinCampana = true; this.pintar(modelo); }
    },
    agregarBanners() {
      const exterior = document.createElement('div');
      exterior.id = 'banner-apuestas';
      exterior.innerHTML = '<div style="min-height:120px"><iframe src="https://service.adsage.io/ads/get/?type=banner&placement=DH1"></iframe></div>';
      document.getElementById('competiciones').append(exterior);
      const unico = document.createElement('div');
      unico.id = 'banner-unico';
      unico.innerHTML = '<iframe src="https://service.adsage.io/ads/get/?type=banner&placement=DL2"></iframe>';
      document.getElementById('competiciones').append(unico);
    },
  };
  window.maqueta.renderizar();
</script>
</html>
