<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integración Promiedos</title>
<style>
  body { margin: 16px; background: #12452e; color: white; font: 14px sans-serif; }
  .flex-12 { display: flex; flex-direction: column; gap: 12px; }
  [class*="match-info_itemevent__"] { background: #0a2b1d; border-radius: 8px; }
  [class*="event-header_button__"] { display: flex; align-items: center; padding: 4px 12px; }
  [class*="event-header_left__"] { flex: 1; }
  [class*="event-header_right__"] { display: flex; gap: 8px; }
  button { width: 24px; height: 24px; }
  button svg { width: 18px; height: 18px; }
  .item-event__content { min-height: 80px; }
  .header__container { display: flex; align-items: center; justify-content: space-between; }
  .header__buttons { display: none; }
  @media (max-width: 767.98px) {
    .header { position: relative; z-index: 100; }
    .header__buttons { display: flex; }
    [class*="aside_mainBlockAside__"] { position: fixed; top: 0; width: 100%; height: 100vh; z-index: 70; background: #12452e; padding-top: 64px; }
  }
</style>
<header class="header">
  <div class="header__container">
    <a class="header__logo" href="/">Promiedos</a>
    <div class="header__buttons">
      <button class="header__button-menu icon-menu" aria-label="Menú" aria-expanded="false">☰</button>
    </div>
  </div>
</header>
<aside class="aside_mainBlockAside__newhash" style="right: -120%">
  <a href="/league/test/bac">Libertadores</a>
</aside>
<div class="main-header-block_botton-header__buttons__newhash">
  <button class="main-header-block_greencuotas__newhash">CUOTAS</button>
  <div class="styles_badge__newhash">Aviso cuotas</div>
</div>
<div class="styles_badge__unrelated" id="unrelated-badge">Otro aviso</div>
<div class="promotions"><div class="reclama-block-1">Promoción</div></div>
<main><div class="flex-12" id="leagues"></div></main>
<script>
  const menuButton = document.querySelector('.header__button-menu');
  menuButton.onclick = () => {
    const expanded = menuButton.getAttribute('aria-expanded') !== 'true';
    menuButton.setAttribute('aria-expanded', String(expanded));
    document.querySelector('aside').style.right = expanded ? '0' : '-120%';
  };
  const state = new Map();
  window.nativeClicks = { collapse: 0, sound: 0 };
  window.fixture = {
    render(leagues = [
      { id: 'bac', name: 'Libertadores' },
      { id: 'dij', name: 'Sudamericana' },
      { id: 'bae', name: 'Liga', noLink: true },
      { id: 'zzz', name: 'Liga' },
    ]) {
      document.getElementById('leagues').replaceChildren();
      for (const league of leagues) {
        const card = document.createElement('div');
        card.className = 'unrelated match-info_itemevent__newhash';
        card.dataset.fixtureId = league.id;
        const model = { ...league, card, expanded: true, sound: true };
        state.set(league.id, model);
        document.getElementById('leagues').append(card);
        this.paint(model);
      }
    },
    paint(model) {
      const { card, id, name, noLink, expanded, sound, noBell } = model;
      card.innerHTML = `
        <div class="event-header_button__newhash">
          <${noLink ? 'div' : 'a'} class="event-header_left__newhash" ${noLink ? '' : `href="/league/test/${id}"`}>
            <img src="https://api.promiedos.com.ar/images/league/${id}/1" alt="">${name}
          </${noLink ? 'div' : 'a'}>
          <div class="event-header_right__newhash">
            ${noBell ? '' : `<button data-native="sound"><svg class="lucide lucide-${sound ? 'bell' : 'bell-off'}"></svg></button>`}
            <button data-native="collapse"><svg class="lucide lucide-chevron-down" style="transform:${expanded ? 'rotate(180deg)' : ''}"></svg></button>
          </div>
        </div>
        ${expanded ? '<div class="item-event__content"><span class="score">0 - 0</span><div class="match-block__cof">1.5</div></div>' : ''}`;
      card.querySelector('[data-native="collapse"]').onclick = () => {
        window.nativeClicks.collapse++;
        model.expanded = !model.expanded;
        // Rebuild the header as React can do during navigation/reconciliation.
        this.paint(model);
      };
      const bell = card.querySelector('[data-native="sound"]');
      if (bell) bell.onclick = () => {
        window.nativeClicks.sound++;
        model.sound = !model.sound;
        this.paint(model);
      };
    },
    soundOff() {
      for (const model of state.values()) { model.noBell = true; this.paint(model); }
    },
    addBanners() {
      const outer = document.createElement('div');
      outer.id = 'betting-banner';
      outer.innerHTML = '<div style="min-height:120px"><iframe src="https://service.adsage.io/ads/get/?type=banner&placement=DH1"></iframe></div>';
      document.getElementById('leagues').append(outer);
      const single = document.createElement('div');
      single.id = 'single-banner';
      single.innerHTML = '<iframe src="https://service.adsage.io/ads/get/?type=banner&placement=DL2"></iframe>';
      document.getElementById('leagues').append(single);
    },
  };
  window.fixture.render();
</script>
</html>
